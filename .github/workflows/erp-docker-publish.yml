name: ERP Docker Publish

on:
  push:
    branches: [main]
    tags: ["erp-v*"]
    paths: ["erp/**", ".github/workflows/erp-docker-publish.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository owner (GHCR requirement)
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/sironic-erp
          tags: |
            type=ref,event=branch
            type=match,pattern=erp-v(.*),group=1
            type=sha

      # No build-args / secrets: runtime env is supplied by the Portainer stack only.
      - uses: docker/build-push-action@v6
        with:
          context: erp
          file: erp/apps/erp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
