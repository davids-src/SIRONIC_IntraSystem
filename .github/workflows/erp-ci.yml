name: ERP CI

on:
  push:
    branches: [main]
    paths: ["erp/**", ".github/workflows/erp-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["erp/**", ".github/workflows/erp-ci.yml"]

concurrency:
  group: erp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: erp
    env:
      AUTH_SECRET: ci-build-secret-minimum-32-characters-long
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: erp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # CI=true excludes *.integration.test.ts from `pnpm test` (parallel memory Mongo is flaky).
      - name: Test (unit)
        run: pnpm test
        env:
          CI: true

      # Memory-Mongo integration tests (incl. the /setup + login smoke test), one package at a time.
      - name: Test (integration)
        run: pnpm test:integration --concurrency=1

      - name: Guard scripts
        run: node scripts/verify-button-aschild.mjs

      # Dummy env only: the build never connects to a database.
      - name: Build
        run: pnpm build
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: sironic_erp
          AUTH_URL: http://localhost:3000
          APP_URL: http://localhost:3000
          SMTP_HOST: localhost
          SMTP_PORT: "587"
          SMTP_USER: ci
          SMTP_PASS: ci
          SMTP_FROM: no-reply@ci.local
          SMTP_SECURE: "false"
